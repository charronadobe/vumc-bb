name: Refresh medical feeds

# Medical Xpress does not send CORS headers, so pages cannot read its RSS feed directly.
# Keep a copy in the repo instead; the site serves it from its own origin at
# /widgets/medical-feeds/feed.xml, which the medical-feeds block uses as its Feed URL.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Medical Xpress feed
        run: |
          curl -fsSL --retry 3 --max-time 60 \
            -A "Mozilla/5.0 (compatible; vumc-bb-medical-feeds)" \
            -o "$RUNNER_TEMP/feed.xml" https://medicalxpress.com/rss-feed/
          # keep the previous copy if the response is not an RSS feed
          grep -q '<rss' "$RUNNER_TEMP/feed.xml"
          mv "$RUNNER_TEMP/feed.xml" widgets/medical-feeds/feed.xml

      - name: Commit the new copy
        run: |
          if git diff --quiet -- widgets/medical-feeds/feed.xml; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add widgets/medical-feeds/feed.xml
          git commit -m "Refresh medical feeds copy"
          git push
